<style>
/* الشاليه — رمل وبحر. one calm column, wider on iPad; charts are CSS bars so nothing can clip */
:root{
  --bg:#F5EEDF;--surface:#FFFCF5;--surface2:#EFE6D2;--line:#E0D3B8;--fg:#1B2A35;--muted:#667380;
  --sea:#1B6F9E;--sea2:#0E4A6E;--sand:#C9964A;--palm:#3E8E6E;--coral:#D2573F;--orange:#D9822B;--purple:#7B61C9;
  --ok:#2E7D5B;--okbg:#DCF0E5;--warn:#A9620C;--warnbg:#FDEBCB;--bad:#C0392B;--badbg:#FBE0DC;--info:#1B6F9E;--infobg:#DCEBF5;
  --input:#FFF6DA;--inputline:#E5CF86;--wkd:#F7E7BF;--hol:#FBD9B5;--shadow:0 1px 2px rgba(60,40,10,.08),0 6px 18px rgba(60,40,10,.06);
  --font:"Cairo","Geeza Pro","Segoe UI",Tahoma,system-ui,sans-serif;--disp:"Cairo","Geeza Pro",Tahoma,system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1822;--surface:#13242F;--surface2:#1B3140;--line:#2A4456;--fg:#EAF1F5;--muted:#9AB0BE;
  --sea:#5DB5E6;--sea2:#0B3C59;--sand:#E2B567;--palm:#58BE98;--coral:#F08466;--orange:#F4A94E;--purple:#A18DEB;
  --ok:#5ED0A0;--okbg:#143A2D;--warn:#F4A94E;--warnbg:#4A3412;--bad:#FF8577;--badbg:#4B1F1A;--info:#7CC6EE;--infobg:#17384D;
  --input:#3A3414;--inputline:#7A6A22;--wkd:#3A3318;--hol:#4A3016;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1822;--surface:#13242F;--surface2:#1B3140;--line:#2A4456;--fg:#EAF1F5;--muted:#9AB0BE;
  --sea:#5DB5E6;--sea2:#0B3C59;--sand:#E2B567;--palm:#58BE98;--coral:#F08466;--orange:#F4A94E;--purple:#A18DEB;
  --ok:#5ED0A0;--okbg:#143A2D;--warn:#F4A94E;--warnbg:#4A3412;--bad:#FF8577;--badbg:#4B1F1A;--info:#7CC6EE;--infobg:#17384D;
  --input:#3A3414;--inputline:#7A6A22;--wkd:#3A3318;--hol:#4A3016;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5;direction:rtl;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.app{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:12px 120px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
h1,h2,h3{font-family:var(--disp);margin:0;font-weight:700;text-wrap:balance}
small,.muted{color:var(--muted)}
/* top */
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding-block:8px 6px;margin-inline:-16px;padding-inline:16px}
.titlebar{display:flex;align-items:center;gap:8px;justify-content:space-between}
.titlebar h1{font-size:1.35rem;display:flex;align-items:center;gap:8px}
.logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--sea2),var(--sea));display:grid;place-items:center;color:#fff;font-size:1rem}
.tbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-width:42px;height:42px;display:grid;place-items:center;font-size:1.05rem;padding:0 10px}
.tbtn.on{background:var(--sea);color:#fff;border-color:var(--sea)}
.mbar{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px}
.mbar b{font-family:var(--disp);min-width:140px;text-align:center;font-size:1.1rem}
.mbar button{border:1px solid var(--line);background:var(--surface);width:42px;height:42px;border-radius:12px;font-size:1.2rem}
.mbar .today{width:auto;padding:0 12px;font-size:.85rem}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-block:12px}
.card{background:var(--surface);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.card .lab{font-size:.82rem;color:var(--muted);font-weight:600}
.card .val{font-family:var(--disp);font-size:1.45rem;font-weight:700;margin-block:2px;overflow-wrap:anywhere}
.card .sub{font-size:.78rem;color:var(--muted)}
.card.neg .val{color:var(--bad)}
.hero{background:linear-gradient(135deg,var(--sea2),var(--sea));color:#fff;border-color:transparent;padding:16px;margin-block:12px}
.hero .lab,.hero .sub{color:#ffffffcc}
.hero .val{font-size:2.1rem;font-family:var(--disp);font-weight:700}
.hero.neg .val{color:#FFC9C2}
.brk{margin-top:10px;border-top:1px solid #ffffff33;padding-top:8px;display:grid;gap:4px;font-size:.9rem}
.brk div{display:flex;justify-content:space-between;gap:8px}
.brk .m{color:#FFD9D3}
.sec{margin-block:18px}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:8px}
.sechead h2{font-size:1.1rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.pad{padding:12px 14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.note{font-size:.82rem;color:var(--muted);margin:6px 0 0}
/* buttons */
.btn{border:0;border-radius:12px;background:var(--sea);color:#fff;padding:10px 16px;font-weight:700;min-height:44px}
.btn.ghost{background:transparent;color:var(--sea);border:1.5px solid var(--sea)}
.btn.coral{background:var(--coral)}
.btn.sand{background:var(--sand);color:#2a1d05}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.5}
.linkb{border:0;background:none;color:var(--sea);text-decoration:underline;padding:4px;font-size:.88rem}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.76rem;font-weight:700;background:var(--surface2);color:var(--fg);white-space:nowrap}
.pill.paid{background:var(--okbg);color:var(--ok)}.pill.due{background:var(--warnbg);color:var(--warn)}.pill.late{background:var(--badbg);color:var(--bad)}.pill.info{background:var(--infobg);color:var(--info)}
/* forms */
.fld{display:grid;gap:4px}
.fld label,.lbl{font-size:.82rem;color:var(--muted);font-weight:600}
input.plain,select.plain,textarea,.inp{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:9px 11px;min-height:44px}
.in{background:var(--input);border-color:var(--inputline)}
input.plain.in,select.plain.in,textarea.in{background:var(--input);border-color:var(--inputline)}
textarea{min-height:96px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.seg{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;min-height:42px;font-weight:600;font-size:.9rem}
.seg button.on{background:var(--sea);color:#fff}
.seg button+button{border-inline-start:1px solid var(--line)}
.banner{border-radius:12px;padding:10px 12px;margin-block:8px;font-size:.88rem;display:flex;gap:8px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.ok{background:var(--okbg);color:var(--ok)}.banner.info{background:var(--infobg);color:var(--info)}
/* booking list */
.bk{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center;cursor:pointer;width:100%;background:transparent;border-inline:0;border-top:0;text-align:right}
.bk:last-child{border-bottom:0}
.bk:active{background:var(--surface2)}
.dbadge{flex:0 0 52px;text-align:center;border-radius:12px;background:var(--surface2);padding:4px 2px;line-height:1.15}
.dbadge b{display:block;font-family:var(--disp);font-size:1.25rem}
.dbadge small{font-size:.7rem}
.dbadge.wkd{background:var(--wkd)}.dbadge.hol{background:var(--hol)}
.bk .mid{flex:1;min-width:0}
.bk .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bk .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.bk .amt{text-align:left;direction:ltr;min-width:78px}
.bk .amt b{font-family:var(--disp);font-size:1.05rem;display:block}
.bk.conf{box-shadow:inset 4px 0 0 var(--bad)}
.bk.canc .nm{text-decoration:line-through;color:var(--muted)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:.72rem;color:var(--muted);font-weight:700;padding-block:4px}
.cd{min-height:78px;border-radius:10px;background:var(--surface);border:1px solid var(--line);padding:3px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cd.off{background:transparent;border-color:transparent}
.cd.wkd{background:var(--wkd)}.cd.hol{background:var(--hol)}
.cd.today{outline:2px solid var(--sea)}
.cd .dn{font-size:.78rem;font-weight:700;display:flex;justify-content:space-between;gap:2px}
.cd .hl{font-size:.55rem;color:var(--orange);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%}
.sl{border:0;border-radius:6px;font-size:.66rem;padding:2px 3px;min-height:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;font-weight:700;width:100%}
.sl.free{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.sl.bkd{background:var(--sea);color:#fff}
.sl.cf{background:var(--bad);color:#fff}
.sl.past{opacity:.75}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-inline-end:4px;vertical-align:-2px}
/* charts */
.hb{display:grid;grid-template-columns:minmax(70px,26%) 1fr auto;gap:8px;align-items:center;margin-block:5px;font-size:.86rem}
.hb .bar{height:14px;border-radius:7px;background:var(--surface2);overflow:hidden;direction:rtl}
.hb .bar i{display:block;height:100%;border-radius:7px;background:var(--sea)}
.hb .v{font-weight:700;direction:ltr;min-width:48px;text-align:left}
.vb{display:flex;align-items:flex-end;gap:4px;height:130px;padding-top:6px}
.vb .col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0;gap:2px}
.vb .pair{display:flex;align-items:flex-end;gap:2px;height:100%;width:100%;justify-content:center}
.vb .pair i{display:block;width:42%;max-width:16px;border-radius:4px 4px 0 0;min-height:1px}
.vb small{font-size:.62rem;white-space:nowrap}
.donut{width:104px;height:104px;border-radius:50%;flex:0 0 auto;position:relative}
.donut::after{content:"";position:absolute;inset:24px;border-radius:50%;background:var(--surface)}
.lg{display:grid;gap:4px;font-size:.84rem}
.lg i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-inline-end:6px}
/* misc lists */
.li{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);align-items:center}
.li:last-child{border-bottom:0}
.li .t{min-width:0}.li .t b{display:block}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-inline-end:6px}
.kpi2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mk{padding:12px 14px;border-bottom:1px solid var(--line)}.mk:last-child{border-bottom:0}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-block:8px}
.dgrid>div{background:var(--surface2);border-radius:12px;padding:8px 10px}
.dgrid small{display:block;font-size:.72rem}.dgrid b{font-family:var(--disp)}
.xrow{display:grid;grid-template-columns:1.6fr .6fr .8fr .9fr;gap:6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line)}
.xrow:last-child{border-bottom:0}.xrow .tot{text-align:left;direction:ltr;font-weight:700}
.xrow input{min-height:40px;padding:6px 8px}
.xrow.h{font-size:.74rem;color:var(--muted);font-weight:700}
.xrow.ex{grid-template-columns:1.5fr .55fr .8fr .8fr 34px}
/* bottom nav */
nav.bar{position:fixed;inset-inline:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bar .navin{display:flex;width:100%;max-width:860px}
nav.bar button{flex:1;border:0;background:transparent;padding:8px 2px 6px;display:grid;justify-items:center;gap:1px;font-size:.7rem;color:var(--muted);font-weight:600;position:relative}
nav.bar button svg{width:24px;height:24px}
nav.bar button.on{color:var(--sea)}
nav.bar button .bd{position:absolute;top:4px;inset-inline-start:calc(50% + 8px);background:var(--coral);color:#fff;border-radius:999px;font-size:.62rem;padding:0 5px;min-width:16px}
/* modal + toast */
#modal{position:fixed;inset:0;z-index:50;display:none;background:#0008;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){#modal{align-items:center}.sheet{border-radius:20px}}
.sheet h2{font-size:1.2rem;margin-bottom:10px}
.sheet .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sheet .acts .btn{flex:1;min-width:120px}
#toast{position:fixed;inset-inline:16px;bottom:90px;z-index:60;display:none;justify-content:center;pointer-events:none}
#toast span{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:.92rem;box-shadow:0 6px 20px #0004;max-width:560px}
#toast.on{display:flex}
.prev{background:var(--surface2);border-radius:12px;padding:8px 12px;font-size:.88rem;margin-top:10px;display:grid;gap:2px}
.warnl{color:var(--bad);font-weight:700;font-size:.84rem}
.chk{display:flex;gap:8px;align-items:flex-start;padding:8px 12px;border-bottom:1px solid var(--line);font-size:.9rem}
.chk:last-child{border-bottom:0}
.search{width:100%}
@media (min-width:700px){.cd{min-height:96px}.sl{font-size:.74rem}}
@media print{nav.bar,.top{display:none}}

</style>
<div class="app" id="app"></div><nav class="bar" id="nav"></nav><div id="modal"></div><div id="toast" aria-live="polite"></div>
<script>
/* ===== CORE (pure logic, no DOM) — الشاليه ===== */
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const DOW=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const EPS=0.005;
const pad=n=>String(n).padStart(2,'0');
const ymd=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const ymk=(y,m)=>y+'-'+pad(m);
function dnum(s){const p=String(s).split('-');return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/864e5);}
function fromD(n){const d=new Date(n*864e5);return ymd(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate());}
const addD=(s,k)=>fromD(dnum(s)+k);
const dowOf=s=>new Date(dnum(s)*864e5).getUTCDay();
const dim=(y,m)=>new Date(Date.UTC(y,m,0)).getUTCDate();
const validDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)&&fromD(dnum(s))===s;
const partsOf=s=>{const p=s.split('-');return{y:+p[0],m:+p[1],d:+p[2]};};
const todayStr=(d)=>{d=d||new Date();return ymd(d.getFullYear(),d.getMonth()+1,d.getDate());};
function num(s){
  if(typeof s==='number')return isFinite(s)?s:0;
  s=String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٫]/g,'.').replace(/[٬,\s]/g,'');
  const n=parseFloat(s);return isFinite(n)?n:0;
}
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);}
const SECS=[1,2];

/* ---------- default state ---------- */
const DEFAULT_HOLIDAYS=[
 ['2026-02-22','يوم التأسيس',0],['2026-03-20','عيد الفطر',1],['2026-03-21','عيد الفطر',1],['2026-03-22','عيد الفطر',1],['2026-03-23','عيد الفطر',1],
 ['2026-05-26','يوم عرفة',1],['2026-05-27','عيد الأضحى',1],['2026-05-28','عيد الأضحى',1],['2026-05-29','عيد الأضحى',1],['2026-09-23','اليوم الوطني',0],
 ['2027-02-22','يوم التأسيس',0],['2027-03-09','عيد الفطر',1],['2027-03-10','عيد الفطر',1],['2027-03-11','عيد الفطر',1],['2027-03-12','عيد الفطر',1],
 ['2027-05-15','يوم عرفة',1],['2027-05-16','عيد الأضحى',1],['2027-05-17','عيد الأضحى',1],['2027-05-18','عيد الأضحى',1],['2027-05-19','عيد الأضحى',1],['2027-09-23','اليوم الوطني',0]];
function defState(){
  return {v:1,
    settings:{
      marketers:[{id:'direct',name:'مباشر',fixed:0,pct:0},{id:'m1',name:'أنجي',fixed:50,pct:20},{id:'m2',name:'خالد هزازي',fixed:50,pct:30},{id:'m3',name:'A',fixed:50,pct:0}],
      fixedItems:['فاتورة الكهرب','فاتورة النت','خزان الموية','راتب العامل','مقاضي العامل'].map((n,i)=>({id:'f'+(i+1),name:n,count:1})),
      holidays:DEFAULT_HOLIDAYS.map(([date,name,approx])=>({id:'h'+date,date,name,approx:!!approx})),
      lastBackup:0},
    bookings:[],exp:{},settle:[]};
}
/* ---------- booking basics ---------- */
const isLive=b=>!b.del;
const isActive=b=>!b.del&&b.status==='active';
const keepsDeposit=b=>!b.del&&(b.status==='active'||b.status==='noshow');
function mkOf(S,id){return S.settings.marketers.find(x=>x.id===id)||null;}
function mkName(S,id){const m=mkOf(S,id);return m?m.name:'مباشر';}
function bNights(b){const a=[];for(let i=0;i<Math.max(1,b.nights|0);i++)a.push(addD(b.start,i));return a;}
const bFixed=b=>r2((b.rate&&b.rate.fixed||0)*Math.max(1,b.nights|0)*(b.secs||[1]).length);
function bComm(b){
  if(b.del||!b.rate)return 0;
  const pct=b.rate.pct||0;
  if(b.status==='active'){
    if(b.mk==='direct'&&!(b.rate.fixed||b.rate.pct))return 0;
    const F=bFixed(b);return r2(F+pct/100*Math.max(b.total-F,0));
  }
  if(b.status==='noshow'&&b.cxComm)return r2(pct/100*b.deposit);   // cancelled: percentage on the deposit only, no fixed amount
  return 0;
}
function bIncome(b){if(b.del)return 0;if(b.status==='active')return b.total;if(b.status==='noshow')return b.deposit;return 0;}

/* ---------- chart helpers (CSS bars) ---------- */
function hbars(rows,o){
  o=o||{};const mx=Math.max(1e-9,...rows.map(r=>Math.abs(r.v)));
  return rows.map(r=>`<div class="hb"><span>${esc(r.l)}</span><span class="bar"><i style="width:${Math.max(r.v!==0?2:0,Math.abs(r.v)/mx*100)}%;background:${r.c||(r.v<0?'var(--bad)':o.c||'var(--sea)')}"></i></span><span class="v">${o.f?o.f(r.v):fmt(r.v)}</span></div>`).join('');
}
function vbars(rows,series){   // rows:[{l, vals:[..]}] series:[{c,name}]
  const mx=Math.max(1e-9,...rows.flatMap(r=>r.vals.map(Math.abs)));
  return `<div class="vb">${rows.map(r=>`<div class="col"><div class="pair">${r.vals.map((v,i)=>`<i title="${esc(series[i].name)}: ${fmt(v)}" style="height:${Math.abs(v)/mx*100}%;background:${v<0?'var(--bad)':series[i].c}"></i>`).join('')}</div><small>${esc(r.l)}</small></div>`).join('')}</div>
  <div class="legend">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.name)}</span>`).join('')}</div>`;
}
function donut(parts){
  const tot=parts.reduce((a,p)=>a+p.v,0);if(tot<=0)return '<p class="note">لا توجد أرقام بعد.</p>';
  let acc=0;const segs=parts.filter(p=>p.v>0).map(p=>{const a=acc/tot*100;acc+=p.v;return `${p.c} ${a}% ${acc/tot*100}%`;});
  return `<div class="row"><div class="donut" style="background:conic-gradient(${segs.join(',')})"></div><div class="lg">${parts.map(p=>`<div><i style="background:${p.c}"></i>${esc(p.l)}: <b class="num">${fmt(p.v)}</b> <small>(${Math.round(p.v/tot*100)}%)</small></div>`).join('')}</div></div>`;
}

function readForm(){
  const f=ui.form,g=id=>{const el=document.getElementById(id);return el?el.value:'';};
  const d=f.d;
  d.start=g('bf_start');d.nights=Math.min(30,Math.max(1,Math.round(num(g('bf_nights')))||1));d.name=g('bf_name').trim();d.phone=g('bf_phone').trim();d.mk=g('bf_mk')||'direct';
  d.total=Math.max(0,r2(num(g('bf_total'))));d.deposit=Math.max(0,r2(num(g('bf_deposit'))));d.note=g('bf_note').trim();
  const c=document.getElementById('bf_cxc');if(c)d.cxComm=c.checked;
  // marketer rate: keep the booking's frozen rate unless the marketer was changed
  if(f.id&&d.mk===f.origMk&&f.origRate)d.rate=f.origRate;else{const m=mkOf(S,d.mk)||{fixed:0,pct:0};d.rate={fixed:m.fixed||0,pct:m.pct||0};}
  if(d.mk==='direct')d.depWhere='me';
  return d;
}
function moneySync(changed){
  const f=ui.form,el=k=>document.getElementById('bf_'+k);
  f.order=[changed,...f.order.filter(x=>x!==changed)].slice(0,2);
  if(f.order.length<2)return;
  const third=['total','deposit','rem'].find(k=>!f.order.includes(k));
  const v=k=>num(el(k).value);
  let r;
  if(third==='rem')r=v('total')-v('deposit');else if(third==='total')r=v('deposit')+v('rem');else r=v('total')-v('rem');
  r=r2(r);el(third).value=(r<0)?'':(r===0&&!el(third).value&&third!=='rem'?'':String(r));
  if(third==='rem'&&r<0)el(third).value='0';
}
function formPreview(){

function saveForm(copy){

  if(d.deposit>d.total+EPS){toast('العربون أكبر من مبلغ الإيجار');return;}
  const nd=sanitizeBooking(d);if(!nd){toast('بيانات غير صحيحة');return;}
  nd.upd=Date.now();
  let b;
  if(f.id){b=bget(f.id);Object.assign(b,nd,{id:b.id,created:b.created});}
  else{nd.created=Date.now();S.bookings.push(nd);b=nd;}
  const clash=conflictIds(S).has(b.id);
  save();
  const txt=copy?confirmText(S,b):null;
  closeModal();ui.y=partsOf(b.start).y;ui.m=partsOf(b.start).m;render();

}

function stPreview(){
  const r=num((document.getElementById('st_rcv')||{}).value),p=num((document.getElementById('st_pay')||{}).value),b=document.getElementById('st_prev');if(!b)return;
  const net=r2(r-p);b.innerHTML=`<div>${net>0?`النقد الذي يصلك منه: <b class="num">${fmt(net)}</b>`:net<0?`النقد الذي تدفعه له: <b class="num">${fmt(-net)}</b>`:'لا نقد بينكم'}</div>`;
}
/* ---------- backup / import ---------- */
function openImport(){
  showModal(`<h2>استرجاع نسخة احتياطية</h2><p class="note" style="margin:0 0 8px">اختر ملف النسخة، أو الصق نصها. سيستبدل بيانات هذا الجهاز.</p><input type="file" id="im_f" accept=".json,application/json" class="plain"><textarea id="im_t" style="margin-top:8px" placeholder="أو الصق النص هنا"></textarea><div class="acts"><button class="btn" data-act="importGo">استرجاع</button><button class="btn ghost" data-act="closeModal">إلغاء</button></div>`);
}
async function importGo(){
  let txt=(document.getElementById('im_t')||{}).value||'';
  const fi=document.getElementById('im_f');
  if(fi&&fi.files&&fi.files[0]){try{txt=await fi.files[0].text();}catch(e){}}
  let o=null;try{o=sanitize(JSON.parse(txt));}catch(e){}
  if(!o){toast('الملف غير صالح');return;}
  const n=o.bookings.filter(b=>!b.del).length;
  if(!window.confirm(`سيتم استبدال بياناتك بنسخة فيها ${n} حجز. متابعة؟`))return;
  S=o;ui.noCloud=true;save();ui.noCloud=false;closeModal();render();toast('تم الاسترجاع');
  if(typeof Cloud!=='undefined'&&Cloud.active())Cloud.forceUpload();
}

/* ---------- render ---------- */
const NAV=[['home','الرئيسية'],['book','الحجوزات'],['cal','التقويم'],['exp','المصاريف'],['acct','الحساب']];
function render(keepScroll){
  const app=document.getElementById('app');if(!app)return;
  const sy=window.scrollY;
  const V={home:vHome,book:vBook,cal:vCal,exp:vExp,acct:vAcct,year:vYear,set:vSet};
  let h;try{h=(V[ui.tab]||vHome)();}catch(e){h=`<div class="banner bad">حدث خطأ في العرض: ${esc(e&&e.message)}</div>`;console.error(e);}
  app.innerHTML=h;
  const bad=conflictIds(S).size;
  document.getElementById('nav').innerHTML='<div class="navin">'+NAV.map(([k,l])=>`<button class="${ui.tab===k?'on':''}" data-act="tab" data-v="${k}" aria-label="${l}">${ic[k]}<span>${l}</span>${k==='book'&&bad?`<span class="bd">${bad}</span>`:''}</button>`).join('')+'</div>';
  if(keepScroll)window.scrollTo(0,sy);
}
function setTab(t){ui.tab=t;render();window.scrollTo(0,0);}
function shiftMonth(k){let m=ui.m+k,y=ui.y;if(m<1){m=12;y--;}if(m>12){m=1;y++;}ui.m=m;ui.y=y;render();}
/* ---------- events ---------- */
const armed=new WeakMap();
document.addEventListener('click',async ev=>{
  const modal=document.getElementById('modal');
  if(ev.target===modal){closeModal();return;}
  const el=ev.target.closest('[data-act]');if(!el)return;
  if(el.dataset.confirm==='1'&&!armed.get(el)){armed.set(el,1);const o=el.textContent;el.dataset.o=o;el.textContent='اضغط للتأكيد';setTimeout(()=>{armed.delete(el);if(el.isConnected)el.textContent=o;},4000);return;}
  armed.delete(el);
  const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  switch(a){
    case 'tab': setTab(v);break;
    case 'mprev': shiftMonth(-1);break;
    case 'mnext': shiftMonth(1);break;
    case 'mnow': ui.y=NOW.getFullYear();ui.m=NOW.getMonth()+1;render();break;
    case 'yprev': ui.yy--;render();break;
    case 'ynext': ui.yy++;render();break;
    case 'goM': ui.y=ui.yy;ui.m=+el.dataset.m;setTab('home');break;
    case 'bf': ui.bf=v;render(true);break;
    case 'hidebanner': ui.hideBanner=true;render(true);break;
    case 'search': ui.tab='book';render();window.scrollTo(0,0);setTimeout(()=>{const q=document.getElementById('q');if(q)q.focus();},50);break;
    case 'newB': openBooking(null,{start:ymd(ui.y,ui.m,(ui.y===NOW.getFullYear()&&ui.m===NOW.getMonth()+1)?NOW.getDate():1)});break;
    case 'newAt': openBooking(null,{start:el.dataset.d,secs:[+el.dataset.s]});break;
    case 'pasteB': openPaste();break;
    case 'pasteGo': pasteGo();break;
    case 'openB': if(ui.modal&&!ui.form)closeModal();openBooking(id);break;
    case 'closeModal': closeModal();break;
    case 'nights': {const i=document.getElementById('bf_nights');i.value=Math.min(30,Math.max(1,(Math.round(num(i.value))||1)+(+v)));formPreview();break;}
    case 'bfSec': {const d=ui.form.d;d.secs=v==='12'?[1,2]:[+v];el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));formPreview();break;}
    case 'bfDep': ui.form.d.depWhere=v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'bfRem': ui.form.d.rem=v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'bfSave': saveForm(false);break;
    case 'bfSaveCopy': saveForm(true);break;
    case 'cancelB': {const i=ui.form&&ui.form.id;closeModal();openCancel(i);break;}
    case 'cxKind': {ui.form.cx.kind=v;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));const b=bget(ui.form.id);
      document.getElementById('cx_expl').textContent=v==='noshow'?`ينحسب العربون (${fmt(b.deposit)}) في إيرادك، ولا تنحسب عمولة ولا الباقي.`:'ما ينحسب أي مبلغ. العربون رجع للزبون.';
      const cw=document.getElementById('cx_cw');if(cw&&b.rate&&b.rate.pct>0&&b.mk!=='direct')cw.style.display=v==='noshow'?'':'none';break;}
    case 'cxApply': {const b=bget(ui.form.id);if(!b)break;const k=ui.form.cx.kind;b.status=k;b.reason=(document.getElementById('cx_reason').value||'').trim();
      b.cxComm=k==='noshow'&&!!(document.getElementById('cx_comm')||{}).checked;touch(b);save();closeModal();ui.bf='canc';render();toast('تم إلغاء الحجز وتفضّى التاريخ');break;}
    case 'restoreB': {const b=bget(ui.form.id);if(!b)break;b.status='active';b.reason='';b.cxComm=false;touch(b);save();const clash=conflictIds(S).has(b.id);closeModal();ui.bf='active';render();toast(clash?'أعيد تفعيل الحجز — تنبيه: يوجد تعارض':'أعيد تفعيل الحجز');break;}
    case 'delB': {const b=bget(ui.form.id);if(b){b.del=true;touch(b);save();}closeModal();render();toast('تم حذف الحجز');break;}
    case 'remSet': {const b=bget(id);if(b){b.rem=v;touch(b);save();render(true);toast(v==='received'?'سُجّل أنك استلمت الباقي':'سُجّل أن الباقي عند الحارس');}break;}
    case 'availCopy': copyText(availText(S,ui.y,ui.m),'تم نسخ الأيام المتاحة');break;
    case 'stmt': copyText(statementText(S,id,ui.y,ui.m),'تم نسخ الكشف');break;
    case 'settle': openSettle(id);break;
    case 'stFull': {const a=acct(S,ui.form.settle);document.getElementById('st_rcv').value=Math.max(0,a.held)||'';document.getElementById('st_pay').value=Math.max(0,a.comm)||'';stPreview();break;}
    case 'stRcv': {const a=acct(S,ui.form.settle);document.getElementById('st_rcv').value=Math.max(0,a.held)||'';document.getElementById('st_pay').value='';stPreview();break;}
    case 'stPay': {const a=acct(S,ui.form.settle);document.getElementById('st_pay').value=Math.max(0,a.comm)||'';document.getElementById('st_rcv').value='';stPreview();break;}
    case 'stSave': {const r=Math.max(0,r2(num(document.getElementById('st_rcv').value))),p=Math.max(0,r2(num(document.getElementById('st_pay').value)));
      if(r<=0&&p<=0){toast('اكتب مبلغاً');break;}
      const date=document.getElementById('st_date').value;S.settle.push({id:uid(),mk:ui.form.settle,date:validDate(date)?date:todayStr(),rcv:r,pay:p,note:(document.getElementById('st_note').value||'').trim(),del:false,upd:Date.now()});
      save();closeModal();render(true);toast('تم تسجيل الدفعة');break;}
    case 'delSettle': {const x=S.settle.find(s=>s.id===id);if(x){x.del=true;x.upd=Date.now();save();render(true);toast('تم حذف الدفعة');}break;}
    case 'addEx': {const E=getExp(S,ui.y,ui.m,true);const e={id:uid(),name:'',c:null,p:0,note:'',del:false};E.ex.push(e);E.upd=Date.now();save();render(true);setTimeout(()=>{const i=document.querySelector(`[data-xin="ex"][data-id="${e.id}"][data-f="name"]`);if(i)i.focus();},40);break;}
    case 'delEx': {const E=getExp(S,ui.y,ui.m,false);const e=E&&E.ex.find(x=>x.id===id);if(e){e.del=true;E.upd=Date.now();save();render(true);}break;}
    case 'addMk': S.settings.marketers.push({id:uid(),name:'مسوّق جديد',fixed:50,pct:0});save();render(true);break;
    case 'delMk': S.settings.marketers=S.settings.marketers.filter(m=>m.id!==id);save();render(true);break;
    case 'addFx': S.settings.fixedItems.push({id:'f'+uid(),name:'بند جديد',count:1});save();render(true);break;
    case 'delFx': S.settings.fixedItems=S.settings.fixedItems.filter(m=>m.id!==id);save();render(true);break;
    case 'delHol': S.settings.holidays=S.settings.holidays.filter(h=>h.id!==id);save();render(true);break;
    case 'export': {const name='chalet-backup-'+todayStr()+'.json';const ok=CAN_DL&&download(name,JSON.stringify(S));S.settings.lastBackup=Date.now();save();if(ok)toast('تم تحميل النسخة');else copyText(JSON.stringify(S),'تم نسخ النسخة');render(true);break;}
    case 'exportCopy': S.settings.lastBackup=Date.now();save();copyText(JSON.stringify(S),'تم نسخ النسخة الاحتياطية');render(true);break;
    case 'importOpen': openImport();break;
    case 'importGo': importGo();break;
    case 'wipe': if(typeof Cloud!=='undefined'&&Cloud.active()){toast('سجّل خروج من المزامنة أولاً');break;}S=defState();save();render();toast('تم مسح البيانات');break;
    case 'cloudSync': Cloud.sync();break;
    case 'cloudOut': Cloud.signOut();render(true);break;
    case 'cloudClear': Cloud.clearConfig();render(true);break;
    case 'cloudReset': {const em=(document.getElementById('cl_email')||{}).value||window.prompt('اكتب إيميلك')||'';if(!em.trim())break;try{await Cloud.resetPassword(em.trim());toast('أرسلنا رابط تغيير كلمة السر لإيميلك');}catch(err){toast(Cloud.errAr(err));}break;}
    case 'cloudUseRemote': await Cloud.resolveChoice('remote');render(true);break;
    case 'cloudUseLocal': await Cloud.resolveChoice('local');render(true);break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='q'){ui.q=t.value;const bl=document.getElementById('blist');if(bl)bl.innerHTML=bookList();return;}
  if(t.closest&&t.closest('#bf')){if(t.dataset.money)moneySync(t.dataset.money);formPreview();return;}
  if(t.id==='st_rcv'||t.id==='st_pay'){stPreview();return;}
  if(t.dataset.xin){
    const f=t.dataset.f,id=t.dataset.id,E=getExp(S,ui.y,ui.m,true);
    if(t.dataset.xin==='fx'){const o=E.fx[id]||(E.fx[id]={c:null,p:null});o[f]=t.value.trim()===''?null:num(t.value);}
    else{const e=E.ex.find(x=>x.id===id);if(e){if(f==='name')e.name=t.value;else if(f==='c')e.c=t.value.trim()===''?null:num(t.value);else e.p=num(t.value);}}
    E.upd=Date.now();save();updateExpTotals();return;}
  if(t.dataset.set){
    const f=t.dataset.f,id=t.dataset.id;
    if(t.dataset.set==='mk'){const m=mkOf(S,id);if(m&&m.id!=='direct'){if(f==='name')m.name=t.value;else if(f==='fixed')m.fixed=Math.max(0,num(t.value));else m.pct=Math.max(0,Math.min(100,num(t.value)));save();}}
    else{const it=S.settings.fixedItems.find(x=>x.id===id);if(it){if(f==='name')it.name=t.value;else it.count=num(t.value);save();}}
  }
});
document.addEventListener('submit',async ev=>{
  const form=ev.target.closest('[data-form]');if(!form)return;ev.preventDefault();
  const kind=form.dataset.form,fd=Object.fromEntries(new FormData(form).entries());
  if(kind==='cloudCfg'){if(Cloud.configure(String(fd.txt||''))){toast('تم حفظ الإعداد');render(true);}else toast('ما لقيت apiKey و projectId في النص');}
  else if(kind==='cloudLogin'){
    const em=String(fd.email||'').trim(),pw=String(fd.pw||''),ps=String(fd.pass||'');
    if(!em||!pw){toast('اكتب الإيميل وكلمة السر');return;}
    try{await Cloud.signIn(em,pw,ps,false);}catch(err){toast(Cloud.errAr(err));render(true);return;}
    if(Cloud.ctl.status==='badpass'){const m=Cloud.ctl.msg;Cloud.signOut();toast(m);}else toast('تم الدخول');
    render(true);
  }
  else if(kind==='addHol'){
    if(!validDate(fd.date)||!String(fd.name||'').trim()){toast('اكتب التاريخ واسم المناسبة');return;}
    S.settings.holidays.push({id:'h'+uid(),date:fd.date,name:String(fd.name).trim(),approx:!!fd.approx});save();render(true);toast('تمت الإضافة');
  }
});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&ui.modal)closeModal();});
document.addEventListener('focusout',()=>{if(ui.pendingRender){setTimeout(()=>{if(!inputFocused()&&!ui.modal){ui.pendingRender=false;render(true);}},50);}});
/* ---------- boot ---------- */
S=load();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
try{if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}
if(typeof Cloud!=='undefined'){Cloud.hooks({getS:()=>S,setS:o=>{S=o;ui.noCloud=true;save();ui.noCloud=false;cloudDataChanged();},onUpdate:cloudChanged});}
render();
if(typeof Cloud!=='undefined')Cloud.start();


</script>
</body></html>
